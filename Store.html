    <title>Магазин одежды</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            text-align: center;
        }
        .store-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            justify-items: center;
        }
        .product-card {
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
            width: 200px;
            text-align: center;
        }
        .product-card img {
            width: 100%;
            height: auto;
            border-radius: 5px;
        }
        .product-card h2 {
            font-size: 18px;
            margin: 10px 0 5px;
        }
        .product-card input {
            width: 40px;
            margin-top: 10px;
        }
        .cart-button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        nav a.active {
	background:#3463ff6e;
	color:#fff;
}
    </style>

</head>
<body>
    <h1>Магазин</h1>
    <input type="text" id="searchBar" placeholder="Найти товар..." style="padding: 10px; margin-bottom: 20px; width: 50%; font-size: 16px;">
    <!-- Форма для отправки данных -->
    <form id="cartForm" action="https://www.google.com/" method="GET">
        <div class="store-container">
            <div class="product-card">
                <img src="css1/ye_shirt.jpg" alt="футболка">
                <h2>Футболка</h2>
                <p>Цена: 100 р.</p>
                <label>
                    Кол-во:
                    <input type="number" name="футболка" min="0" value="0" data-price="100">
                </label>
            </div>
            <div class="product-card">
                <img src="css1/ye_long.png" alt="лонгслив">
                <h2>Лонгслив</h2>
                <p>Цена: 300 р.</p>
                <label>
                    Кол-во:
                    <input type="number" name="лонгслив" min="0" value="0" data-price="300">
                </label>
            </div>
            <div class="product-card">
                <img src="css1/ye_shoes.jpg" alt="Кроссовки">
                <h2>Кроссовки</h2>
                <p>Цена: 200 р.</p>
                <label>
                    Кол-во:
                    <input type="number" name="кроссовки" min="0" value="0" data-price="200">
                </label>
            </div>
            <div class="product-card">
                <img src="css1/ye_vinyl.png" alt="Винил">
                <h2>Виниловая пластинка</h2>
                <p>Цена: 200 р.</p>
                <label>
                    Кол-во:
                    <input type="number" name="винил" min="0" value="0" data-price="200">
                </label>
            </div>
            <div class="product-card">
                <img src="css1/vulture_tee.png" alt="футболка">
                <h2>Футболка 'Vultures'</h2>
                <p>Цена: 300 р.</p>
                <label>

                    <input type="number" name="футболка_vultures" min="0" value="0" data-price="200">

            </div>
        </div>
        <button type="submit" class="cart-button">В корзину</button>
    </form>
    <script>
        // Search functionality
        document.getElementById("searchBar").addEventListener("input", function() {
            const searchQuery = this.value.toLowerCase(); // Get the search value and make it lowercase
            const products = document.querySelectorAll(".product-card"); // Get all product cards
    
            // Loop through each product and check if it matches the search query
            products.forEach(product => {
                const productName = product.querySelector("h2").textContent.toLowerCase(); // Get product name
                if (productName.includes(searchQuery)) {
                    product.style.display = "block"; // Show product if it matches
                } else {
                    product.style.display = "none"; // Hide product if it doesn't match
                }
            });
        });
    </script>
    
</body>
